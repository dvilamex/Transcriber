[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
version = "0.1.0"
description = "Watch YouTube channels, fetch transcripts, and write theme-based digests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Vilamex" }]
dependencies = [
  "pyyaml>=6.0.2",
  "defusedxml>=0.7.1",
  "youtube-transcript-api>=1.2.0,<2",
  "yt-dlp>=2024.8.6",
  "openai>=1.40.0",
  "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
transcriber = "transcriber.cli:main"

[tool.setuptools.packages.find]
include = ["transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
